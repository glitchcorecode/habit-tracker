<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HABIT TRACKER // SYS</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>HABITS & <br><span class="gradient-text">DAILY INTEL</span></h1>
        <p class="subtitle">Твой персональный трекер привычек.</p>
    </header>

    <div class="grid-layout">
        <section class="card">
            <div class="card-header">
                <h2>СЕГОДНЯ</h2>
                <span id="currentDate" class="date-badge">...</span>
            </div>
            
            <div class="progress-container">
                <div class="progress-bar" id="progressBar"></div>
            </div>
            
            <!-- НОВАЯ ФУНКЦИЯ: Поле поиска -->
            <input type="text" id="searchInput" placeholder="Поиск по привычкам..." style="width: 100%; margin-bottom: 15px; background: #000; border: 1px solid var(--border); padding: 12px 16px; border-radius: 8px; color: white; outline: none;">

            <form id="habitForm" class="input-group">
                <input type="text" id="habitInput" placeholder="Новая привычка..." required autocomplete="off">
                <button type="submit">ДОБАВИТЬ</button>
            </form>

            <ul id="habitList" class="habit-list"></ul>
        </section>

        <section class="card">
            <div class="card-header">
                <h2>ИСТОРИЯ</h2>
            </div>
            <div id="historyList" class="history-list">
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
